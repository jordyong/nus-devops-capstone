spring:
  application:
    name: transaction-validator

server:
  port: ${SERVER_PORT:8080}

# Validation rules; each value can be overridden with an environment variable (e.g. from a Kubernetes ConfigMap)
validation:
  max-amount: ${VALIDATION_MAX_AMOUNT:10000.00}
  supported-currencies: ${VALIDATION_SUPPORTED_CURRENCIES:SGD,USD,EUR,GBP,MYR}

management:
  # Actuator (probes + metrics) on its own port: reachable inside the cluster, never through the public NLB
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Latency histogram buckets for http_server_requests_seconds, so Grafana can show p95/p99
      percentiles-histogram:
        http.server.requests: true
