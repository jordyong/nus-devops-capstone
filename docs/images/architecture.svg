<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">
  <title>FinSecure Pay – end-to-end architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#334155;stroke-width:1.2}
      .ext{fill:#f8fafc;stroke:#64748b;stroke-width:1.2}
      .store{fill:#f1f5f9;stroke:#64748b;stroke-width:1.2}
      .e{fill:none;stroke:#334155;stroke-width:1.4;marker-end:url(#a)}
      .d{fill:none;stroke:#64748b;stroke-width:1.2;stroke-dasharray:4 3}
      .lbl{font-size:11px;fill:#475569}
      .t{font-weight:600}
      .small{font-size:11px;fill:#334155}
      .grp{font-size:12px;font-weight:600;fill:#334155}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- ===== Delivery lane ===== -->
  <rect class="ext" x="20" y="57" width="100" height="36" rx="18"/><text x="70" y="80" text-anchor="middle">Developer</text>
  <rect class="store" x="160" y="55" width="120" height="40" rx="6"/><text x="220" y="80" text-anchor="middle">GitHub repo</text>
  <rect class="ext" x="320" y="55" width="120" height="40" rx="6"/><text x="380" y="80" text-anchor="middle">smee.io relay</text>

  <rect x="470" y="20" width="490" height="125" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text class="grp" x="482" y="38">Developer laptop · Docker</text>
  <rect class="box" x="485" y="55" width="100" height="40" rx="6"/><text x="535" y="80" text-anchor="middle">smee client</text>
  <rect class="box" x="610" y="45" width="335" height="88" rx="6"/>
  <text x="625" y="66" class="t">Jenkins <tspan font-weight="400" class="small">(configuration as code)</tspan></text>
  <text x="625" y="85" class="small">Build › Test › Package › Security gates (SpotBugs, Trivy)</text>
  <text x="625" y="102" class="small">Container build › Image scan › Push</text>
  <text x="625" y="119" class="small">Deploy (auto-undo) › Smoke test · email-ext</text>

  <rect class="store" x="1010" y="55" width="160" height="40" rx="6"/><text x="1090" y="80" text-anchor="middle">Docker Hub</text>

  <path class="e" d="M120,75 H158"/><text class="lbl" x="139" y="68" text-anchor="middle">push</text>
  <path class="e" d="M280,75 H318"/><text class="lbl" x="300" y="68" text-anchor="middle">hook</text>
  <path class="e" d="M440,75 H483"/><text class="lbl" x="462" y="68" text-anchor="middle">SSE</text>
  <path class="e" d="M585,75 H608"/>
  <path class="e" d="M945,75 H1008"/><text class="lbl" x="977" y="68" text-anchor="middle">push</text>

  <!-- ===== AWS ===== -->
  <rect x="150" y="180" width="830" height="400" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.4"/>
  <text class="grp" x="164" y="199">AWS ap-southeast-1 · VPC 10.0.0.0/16 · provisioned by Terraform</text>

  <rect x="170" y="210" width="790" height="78" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text class="small" x="182" y="226">Public subnets (2 AZs)</text>
  <rect class="box" x="190" y="236" width="180" height="40" rx="6"/><text x="280" y="261" text-anchor="middle">Network Load Balancer</text>
  <rect class="box" x="600" y="236" width="150" height="40" rx="6"/><text x="675" y="261" text-anchor="middle">NAT gateway</text>

  <rect x="170" y="300" width="600" height="262" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.3"/>
  <text class="grp" x="182" y="318">EKS finsecure-eks · 2× m7i-flex.large · private subnets</text>

  <!-- namespace finsecure -->
  <rect x="185" y="330" width="255" height="220" rx="6" fill="#fff" stroke="#93c5fd"/>
  <text class="small" x="195" y="346" font-weight="600">namespace finsecure</text>
  <rect class="box" x="198" y="370" width="110" height="74" rx="6"/>
  <text x="253" y="390" text-anchor="middle" class="t">pod · AZ a</text>
  <text x="253" y="410" text-anchor="middle" class="small">:8080 API</text>
  <text x="253" y="427" text-anchor="middle" class="small">:8081 actuator</text>
  <rect class="box" x="318" y="370" width="110" height="74" rx="6"/>
  <text x="373" y="390" text-anchor="middle" class="t">pod · AZ b</text>
  <text x="373" y="410" text-anchor="middle" class="small">:8080 API</text>
  <text x="373" y="427" text-anchor="middle" class="small">:8081 actuator</text>
  <text class="small" x="198" y="468">Deployment ×2 · rolling, maxUnavailable 0</text>
  <text class="small" x="198" y="486">ConfigMap · probes · PDB minAvailable 1</text>
  <text class="small" x="198" y="504">non-root · read-only FS · caps dropped</text>
  <text class="small" x="198" y="522">metrics Service :8081 (ClusterIP only)</text>

  <!-- namespace monitoring -->
  <rect x="470" y="330" width="285" height="220" rx="6" fill="#fff" stroke="#93c5fd"/>
  <text class="small" x="480" y="346" font-weight="600">namespace monitoring</text>
  <rect class="box" x="495" y="370" width="110" height="34" rx="6"/><text x="550" y="392" text-anchor="middle">Prometheus</text>
  <rect class="box" x="630" y="370" width="110" height="34" rx="6"/><text x="685" y="392" text-anchor="middle">Grafana</text>
  <rect class="box" x="495" y="440" width="110" height="34" rx="6"/><text x="550" y="462" text-anchor="middle">Alertmanager</text>
  <rect class="box" x="630" y="440" width="110" height="34" rx="6"/><text x="685" y="462" text-anchor="middle">Loki</text>
  <rect class="box" x="630" y="500" width="110" height="34" rx="6"/><text x="685" y="522" text-anchor="middle">Alloy</text>

  <path class="e" d="M630,387 H607"/>
  <path class="e" d="M685,404 V438"/>
  <path class="e" d="M550,404 V438"/>
  <path class="e" d="M685,500 V476"/>

  <!-- side services -->
  <rect class="store" x="790" y="318" width="170" height="44" rx="6"/>
  <text x="875" y="336" text-anchor="middle" class="small" font-weight="600">KMS key</text><text x="875" y="352" text-anchor="middle" class="small">Secrets encryption</text>
  <rect class="store" x="790" y="376" width="170" height="44" rx="6"/>
  <text x="875" y="394" text-anchor="middle" class="small" font-weight="600">CloudWatch Logs</text><text x="875" y="410" text-anchor="middle" class="small">control plane + audit</text>
  <rect class="store" x="790" y="434" width="170" height="60" rx="6"/>
  <text x="875" y="452" text-anchor="middle" class="small" font-weight="600">IAM (least privilege)</text><text x="875" y="468" text-anchor="middle" class="small">finsecure-* deployer</text><text x="875" y="484" text-anchor="middle" class="small">jenkins: 1 namespace</text>
  <path class="d" d="M770,340 H790"/>
  <path class="d" d="M770,398 H790"/>

  <!-- ===== external ===== -->
  <rect class="ext" x="20" y="238" width="110" height="36" rx="18"/><text x="75" y="261" text-anchor="middle">API clients</text>
  <rect class="ext" x="1010" y="520" width="160" height="36" rx="18"/><text x="1090" y="543" text-anchor="middle">Gmail (on-call)</text>

  <!-- ===== flows ===== -->
  <!-- request -->
  <path class="e" d="M130,256 H188"/><text class="lbl" x="159" y="249" text-anchor="middle">HTTP :80</text>
  <path class="e" d="M250,276 V368"/><text class="lbl" x="256" y="296">:8080</text>
  <path class="e" d="M340,276 V368"/>
  <!-- deploy -->
  <path class="e" d="M700,133 V160 H400 V368"/>
  <text class="lbl" x="550" y="174" text-anchor="middle">kubectl apply -k (one rollout, image pinned)</text>
  <!-- image pull -->
  <path class="e" d="M1090,95 V256 H752"/><text class="lbl" x="1096" y="180">image pull</text>
  <path class="e" d="M675,276 V298"/><text class="lbl" x="681" y="292">egress</text>
  <!-- scrape / logs -->
  <path class="e" d="M495,387 H430"/><text class="lbl" x="462" y="380" text-anchor="middle">scrape</text>
  <path class="e" d="M630,517 H442"/><text class="lbl" x="585" y="512" text-anchor="middle">pod logs</text>
  <!-- notifications -->
  <path class="e" d="M520,474 V600 H1090 V558"/><text class="lbl" x="800" y="594" text-anchor="middle">alert emails (SMTP, firing + resolved)</text>
  <path class="e" d="M930,133 V150 H1185 V538 H1172"/><text class="lbl" x="1180" y="330" text-anchor="end">build emails</text>

  <!-- ===== legend ===== -->
  <text class="small" x="20" y="636"><tspan font-weight="600">Delivery:</tspan>  push › webhook › Jenkins › security gates (HIGH/CRITICAL blocks) › Docker Hub › kubectl apply -k › rollout (auto-undo on failure)</text>
  <text class="small" x="20" y="656"><tspan font-weight="600">Request:</tspan>  client › NLB :80 › 2 pods :8080 in 2 AZs · actuator/metrics on :8081 never exposed publicly</text>
  <text class="small" x="20" y="676"><tspan font-weight="600">Feedback:</tspan>  Prometheus scrapes :8081 › alert rules › Alertmanager › email · Alloy › Loki · Grafana shows metrics + logs · Jenkins emails on failed/fixed builds</text>
</svg>
