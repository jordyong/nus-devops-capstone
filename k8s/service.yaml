apiVersion: v1
kind: Service
metadata:
  name: transaction-validator
  namespace: finsecure
  labels:
    app.kubernetes.io/name: transaction-validator
  annotations:
    # Internet-facing AWS Network Load Balancer in the public subnets
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: transaction-validator
  ports:
    - name: http
      port: 80
      targetPort: http
