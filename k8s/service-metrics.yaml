# Cluster-internal Service for the actuator port (Prometheus scraping). Not exposed through the public NLB.
apiVersion: v1
kind: Service
metadata:
  name: transaction-validator-metrics
  namespace: finsecure
  labels:
    app.kubernetes.io/name: transaction-validator
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: transaction-validator
  ports:
    - name: management
      port: 8081
      targetPort: management
